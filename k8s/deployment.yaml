apiVersion: apps/v1
kind: Deployment
metadata:
  name: heatwaves
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heatwaves
  template:
    metadata:
      labels:
        app: heatwaves
    spec:
      containers:
        - name: heatwaves
          image: silly_moore/heatwaves:latest
          ports:
            - containerPort: 80